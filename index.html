<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Videofotista A Fazer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#5a5a5a">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A Fazer">
<style>
  :root {
    --bg: #5a5a5a;
    --card: #4a4a4a;
    --card2: #434343;
    --linha: rgba(255,255,255,.08);
    --txt: #f3f3f3;
    --suave: #b9b9b9;
    --amarelo: #F4C84A;
    --verde: #6FD08C;
    --coral: #EE7D6E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--txt);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; }
  a { color: var(--amarelo); }

  header { padding: 18px 18px 10px; text-align: center; }
  h1 { margin: 0; display: inline-flex; flex-direction: column; gap: 2px; font-weight: 900; font-size: 26px; line-height: 1; letter-spacing: 1.3px; }
  h1 .marca { display: flex; align-items: center; color: #fff; white-space: nowrap; }
  h1 .marca svg { width: 23px; height: 23px; margin: 0 2px; flex: none; }
  h1 .app { color: var(--amarelo); text-align: center; white-space: nowrap; }
  .data { margin-top: 8px; color: var(--suave); font-size: 12.5px; }

  nav { display: flex; gap: 6px; justify-content: center; padding: 6px 14px 12px; }
  nav button {
    background: var(--card); border: 1px solid var(--linha);
    border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px;
  }
  nav button.ativo { background: var(--amarelo); color: #1d1d1d; border-color: var(--amarelo); }
  nav .num { opacity: .7; font-weight: 700; margin-left: 3px; }

  main { flex: 1; overflow-y: auto; padding: 0 14px 14px; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 8px; }

  .caixa {
    background: var(--card); border-radius: 14px; padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); margin-bottom: 12px;
  }
  .caixa h3 { margin: 2px 0 8px; font-size: 13px; color: var(--suave); text-transform: uppercase; letter-spacing: .5px; }
  .campo, .busca, .detalhe input, .detalhe textarea {
    width: 100%; background: var(--card2); border: 1px solid var(--linha);
    border-radius: 10px; padding: 10px 12px; color: var(--txt); outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .campo:focus, .busca:focus, .detalhe input:focus, .detalhe textarea:focus { border-color: rgba(244,200,74,.6); }
  .linha-opcoes { display: flex; align-items: center; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .nova .linha-opcoes:first-child { margin-top: 0; }
  .linha-opcoes .rotulo { color: var(--suave); font-size: 12px; margin-right: 2px; min-width: 62px; }
  .espaco { flex: 1; }
  .linha-acao { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  .prio {
    border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700;
    border: 1px solid transparent; background: transparent; white-space: nowrap;
  }
  .p1 { color: var(--coral); border-color: rgba(238,125,110,.55); }
  .p2 { color: var(--amarelo); border-color: rgba(244,200,74,.55); }
  .p3 { color: var(--verde); border-color: rgba(111,208,140,.55); }
  .p4 { color: var(--suave); border-color: rgba(255,255,255,.25); }
  .escolha { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .escolha .prio, .escolha .tag { opacity: .45; }
  .escolha .sel { opacity: 1; }
  .escolha .prio.sel.p1 { background: rgba(238,125,110,.15); }
  .escolha .prio.sel.p2 { background: rgba(244,200,74,.15); }
  .escolha .prio.sel.p3 { background: rgba(111,208,140,.15); }
  .escolha .prio.sel.p4 { background: rgba(255,255,255,.1); }

  .tag {
    --c: #aaa;
    border-radius: 6px; padding: 2px 8px; font-size: 11.5px; font-weight: 700;
    color: var(--c); border: 1px solid var(--c); background: transparent; white-space: nowrap;
  }
  .escolha .tag.sel { background: rgba(255,255,255,.08); }

  .btn-add {
    background: var(--amarelo); color: #1d1d1d; border: 0; border-radius: 999px;
    padding: 6px 16px; font-weight: 700; font-size: 13px;
  }
  .btn-sec {
    background: var(--card2); border: 1px solid var(--linha); border-radius: 999px;
    padding: 5px 14px; font-weight: 600; font-size: 12.5px;
  }

  .filtro {
    display: flex; align-items: center; gap: 8px; margin: 0 2px 8px; color: var(--suave); font-size: 12.5px;
  }

  .lista { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--card); border-radius: 12px; padding: 10px 10px 10px 12px;
    margin-bottom: 6px; border-left: 4px solid transparent;
    transition: opacity .25s, transform .25s;
  }
  .item.b1 { border-left-color: var(--coral); }
  .item.b2 { border-left-color: var(--amarelo); }
  .item.b3 { border-left-color: var(--verde); }
  .item.b4 { border-left-color: rgba(255,255,255,.18); }
  .item.saindo { opacity: 0; transform: translateX(30px); }
  .item.aberto { background: #505050; }
  .check {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.45); background: transparent; padding: 0;
    display: grid; place-items: center; align-self: flex-start; margin-top: 1px;
  }
  .check:hover { border-color: var(--verde); }
  .check svg { width: 12px; height: 12px; opacity: 0; }
  .check:hover svg { opacity: .7; }
  .check.feito { background: var(--verde); border-color: var(--verde); }
  .check.feito svg { opacity: 1; }
  .corpo { flex: 1; min-width: 0; cursor: pointer; }
  .texto { word-wrap: break-word; }
  .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .meta:empty { display: none; }
  .obs-linha { color: var(--suave); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .adiada { font-size: 11px; color: var(--suave); white-space: nowrap; }
  .adiada.muito { color: var(--coral); }
  .acoes { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .item:hover .acoes { opacity: 1; }
  .icone {
    background: transparent; border: 0; padding: 4px; border-radius: 6px;
    color: var(--suave); display: grid; place-items: center;
  }
  .icone:hover { background: rgba(255,255,255,.08); color: var(--txt); }
  .icone svg { width: 15px; height: 15px; }

  .detalhe { width: 100%; padding: 8px 0 2px 32px; }
  .detalhe input { padding: 8px 10px; margin-bottom: 6px; }
  .detalhe textarea { padding: 8px 10px; min-height: 60px; resize: vertical; font-size: 13px; }
  .detalhe .linha-opcoes { margin: 8px 0 0; }

  .vazio {
    border: 1px dashed rgba(255,255,255,.2); border-radius: 12px;
    padding: 22px 14px; text-align: center; color: var(--suave);
  }
  .vazio .grande { font-size: 15px; color: var(--txt); font-weight: 600; margin-bottom: 4px; }
  .rodape-hoje { text-align: center; margin-top: 10px; }
  .link { background: none; border: 0; color: var(--suave); text-decoration: underline; font-size: 12.5px; padding: 0; }
  .link:hover { color: var(--txt); }

  .grupo { color: var(--suave); font-size: 12px; font-weight: 700; text-transform: uppercase;
           letter-spacing: .5px; margin: 14px 4px 6px; }
  .item.feita .texto { color: var(--suave); }
  .item.feita .acoes { opacity: 1; }
  .item.feita .corpo { cursor: default; }

  .dias { display: flex; gap: 3px; }
  .dia {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--linha);
    background: var(--card2); font-size: 11px; font-weight: 700; color: var(--suave); padding: 0;
  }
  .dia.on { background: var(--amarelo); color: #1d1d1d; border-color: var(--amarelo); }
  .item.rotina .sub { width: 100%; display: flex; align-items: center; gap: 8px; }
  .item.rotina .texto { flex: 1; cursor: text; }

  /* preferências */
  .voltar { margin: 0 0 10px; }
  .pref { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--linha); }
  .pref:first-of-type { border-top: 0; }
  .pref .rot { flex: 1; }
  .pref .rot small { display: block; color: var(--suave); font-size: 11.5px; }
  .chave { width: 38px; height: 22px; border-radius: 999px; background: #333; border: 0; padding: 2px; position: relative; flex: none; }
  .chave::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #aaa; transition: all .15s; }
  .chave.on { background: var(--verde); }
  .chave.on::after { left: 18px; background: #fff; }
  .segmento { display: inline-flex; background: #333; border-radius: 999px; padding: 2px; }
  .segmento button { border: 0; background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 700; color: var(--suave); }
  .segmento button.on { background: var(--amarelo); color: #1d1d1d; }
  .etq { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .etq .bolinha { width: 22px; height: 22px; border-radius: 50%; border: 0; flex: none; padding: 0; }
  .etq input { flex: 1; background: var(--card2); border: 1px solid var(--linha); border-radius: 8px; padding: 6px 8px; color: var(--txt); outline: none; user-select: text; -webkit-user-select: text; }
  .caminho { font-size: 12px; color: var(--suave); word-break: break-all; margin: 2px 0 6px; user-select: text; -webkit-user-select: text; }

  /* sobre */
  .sobre { text-align: center; }
  .sobre img.logo { width: 84px; height: 84px; margin-top: 4px; }
  .sobre h2 { margin: 6px 0 2px; font-size: 16px; }
  .sobre .versao { color: var(--suave); font-size: 12px; }
  .qr { background: #fff; border-radius: 12px; padding: 10px; display: inline-block; margin: 10px 0 6px; line-height: 0; }
  .qr svg { width: 180px; height: 180px; }
  .aviso-backup { border: 1px solid rgba(244,200,74,.45); }
  #versaoApp { cursor: pointer; touch-action: manipulation; display: inline-block; padding: 6px 14px; -webkit-user-select: none; user-select: none; }
  .texto-cafe { margin: 8px 4px 0; font-size: 13.5px; line-height: 1.5; text-align: center; }
  .chave-pix { font-size: 13px; user-select: text; -webkit-user-select: text; word-break: break-all; }

  footer {
    display: flex; align-items: center; gap: 6px; padding: 8px 14px 10px;
    border-top: 1px solid var(--linha); color: var(--suave); font-size: 12px; position: relative;
  }
  #statusSync { margin-left: 8px; white-space: nowrap; }
  .sync-sincronizado { color: var(--verde); }
  .sync-offline, .sync-enviando, .sync-sincronizando { color: var(--suave); }
  .sync-erro { color: var(--coral); }
  footer .btn-rodape {
    background: var(--card); border: 1px solid var(--linha); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; font-weight: 600;
  }
  footer .redondo { width: 28px; height: 28px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
  footer .redondo svg { width: 15px; height: 15px; }
  .menu-backup {
    position: absolute; bottom: 42px; right: 14px; background: #3d3d3d;
    border: 1px solid var(--linha); border-radius: 10px; padding: 4px; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); min-width: 200px; z-index: 5;
  }
  .menu-backup.aberto { display: block; }
  .menu-backup button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 7px 10px; border-radius: 6px; font-size: 13px;
  }
  .menu-backup button:hover { background: rgba(255,255,255,.08); }

  .toast {
    position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%) translateY(20px);
    background: #2f2f2f; color: var(--txt); border-radius: 999px; padding: 8px 8px 8px 16px;
    display: flex; gap: 10px; align-items: center; opacity: 0; pointer-events: none;
    transition: all .2s; box-shadow: 0 6px 18px rgba(0,0,0,.35); font-size: 13px; white-space: nowrap;
  }
  .toast.vis { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast button { background: var(--amarelo); color: #1d1d1d; border: 0; border-radius: 999px;
                  padding: 4px 12px; font-weight: 700; font-size: 12px; }
  .toast button:empty { display: none; }
  .dica { color: var(--suave); font-size: 11.5px; margin: 2px 4px 10px; }

  /* em tela larga (navegador do computador) o app vira uma coluna centralizada */
  header, nav, main, footer { width: 100%; max-width: 560px; margin-left: auto; margin-right: auto; box-sizing: border-box; }

  /* celular: sem "passar o mouse", letra 16px nos campos (evita o zoom do iPhone), cantos da tela */
  @media (hover: none) {
    .acoes { opacity: 1; }
    input, textarea { font-size: 16px !important; }
    .dica-arrastar { display: none; }
  }
  header { padding-top: max(18px, calc(env(safe-area-inset-top) + 22px)); }
  footer { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  body { -webkit-tap-highlight-color: transparent; }

  /* 1.2: quando, horário, arrastar, alarme */
  .pilula {
    border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 700;
    border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--suave);
  }
  .pilula.sel { background: rgba(244,200,74,.15); border-color: rgba(244,200,74,.6); color: var(--amarelo); }
  input.data, input.hora {
    background: var(--card2); border: 1px solid var(--linha); color: var(--txt);
    border-radius: 8px; padding: 3px 6px; font-size: 12px; outline: none; color-scheme: dark;
    user-select: text; -webkit-user-select: text;
  }
  input.data.sel, input.hora.sel { border-color: rgba(244,200,74,.6); color: var(--amarelo); }
  .sino { font-size: 12px; color: var(--amarelo); white-space: nowrap; }
  .sino.passou { color: var(--suave); }
  .item[draggable=true] { cursor: grab; }
  .item.arrastando { opacity: .35; }
  .item.alvo { box-shadow: 0 -3px 0 0 var(--amarelo); }
  .item.destaque { animation: pisca 1s ease-in-out 4; }
  @keyframes pisca { 50% { background: rgba(244,200,74,.28); } }
  .x { background: none; border: 0; color: var(--suave); padding: 0 4px; font-size: 14px; }
  .com-dica { position: relative; display: inline-block; }
  .com-dica .ph { display: none; }
  @media (hover: none) {
    .com-dica.sem-valor .ph { display: block; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--suave); font-size: 14px; pointer-events: none; white-space: nowrap; }
    .com-dica.sem-valor input { color: transparent; min-width: 120px; min-height: 34px; }
  }
  .detalhe input.data, .detalhe input.hora { width: auto; padding: 3px 6px; margin: 0; font-size: 12px; border-radius: 8px; }
  .x:hover { color: var(--txt); }
</style>
</head>
<body>
<header>
  <h1 aria-label="Videofotista A Fazer">
    <span class="marca"><span>VIDEOF</span><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10.5" fill="none" stroke="#F4C84A" stroke-width="4"/><path d="M8.5 13.3l3 3 6-6.3" fill="none" stroke="#F4C84A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>TISTA</span></span>
    <span class="app">A FAZER</span>
  </h1>
  <div class="data" id="data"></div>
</header>
<nav>
  <button data-aba="hoje" class="ativo">Hoje<span class="num" id="numHoje"></span></button>
  <button data-aba="proximos">Próximos<span class="num" id="numProx"></span></button>
  <button data-aba="feitos">Feitos</button>
  <button data-aba="rotina">Rotina</button>
</nav>
<main id="conteudo"></main>
<footer>
  <span id="status"></span><span id="statusSync"></span>
  <span class="espaco"></span>
  <button class="btn-rodape redondo" id="btnSobre" title="Sobre e contribuição">☕</button>
  <button class="btn-rodape redondo" id="btnPrefs" title="Preferências">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
  </button>
  <button class="btn-rodape" id="btnBackup">Backup</button>
  <div class="menu-backup" id="menuBackup">
    <button data-b="exportar">Exportar backup…</button>
    <button data-b="importar">Importar backup…</button>
    <button data-b="pasta" id="bPasta">Abrir pasta de backups</button>
  </div>
</footer>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>
<input type="file" id="arquivo" accept=".json,application/json" style="display:none">

    if (!m || !m[1].trim()) return { texto: txt.trim(), prioridade: prioPadrao };
    var k = m[2].toLowerCase();
    var p = k === "alta" || k === "urgente" || k === "1" ? 1 : k === "baixa" || k === "3" ? 3 : k === "sem" ? 4 : 2;

  function rotuloDia(ds) {

  function payloadPix() {
    function limpa(s, n) {
      return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9 .@-]/g, "").toUpperCase().slice(0, n);
    }
    function f(id, v) { return id + String(v.length).padStart(2, "0") + v; }
    var p = f("00", "01") +
      f("26", f("00", "br.gov.bcb.pix") + f("01", PIX.chave.trim())) +
      f("52", "0000") + f("53", "986") + f("58", "BR") +
      f("59", limpa(PIX.nome, 25)) + f("60", limpa(PIX.cidade, 15)) +
      f("62", f("05", "***")) + "6304";
    var crc = 0xFFFF;
    for (var i = 0; i < p.length; i++) {
      crc ^= p.charCodeAt(i) << 8;
      for (var j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
    return p + crc.toString(16).toUpperCase().padStart(4, "0");
  }

  var conteudo = document.getElementById("conteudo");

  conteudo.addEventListener("click", function (e) {
    if (e.target.closest("a")) return; // links abrem no navegador
    var b = e.target.closest("button");

    if (!b) {
      // clique no corpo da tarefa abre/fecha os detalhes
      var corpo = e.target.closest(".corpo");
      var liC = corpo && corpo.closest(".item");
      if (liC && liC.dataset.id && (aba === "hoje" || aba === "proximos")) {
        aberto = aberto === liC.dataset.id ? null : liC.dataset.id;
        render();
        if (aberto) { var ob = conteudo.querySelector(".det-obs"); if (ob) ob.focus(); }
      }
      return;
    }

    if (b.dataset.ir) { irPara(b.dataset.ir); return; }
    if (b.id === "btnAdd") { adicionar(); return; }
    if (b.dataset.pn) { prioNova = Number(b.dataset.pn); render(); focar(); return; }
    if (b.dataset.qd) { dataNova = b.dataset.qd === hojeStr() ? null : b.dataset.qd; render(); focar(); return; }
    if (b.dataset.semhoraNova) { horaNova = null; render(); focar(); return; }
    if (b.dataset.pe) { etqNova = (etqNova || filtro) === b.dataset.pe ? null : b.dataset.pe; if (!etqNova && filtro === b.dataset.pe) filtro = null; render(); focar(); return; }
    if (b.dataset.pr) { prioRotina = Number(b.dataset.pr); render(); return; }
    if (b.dataset.re) { etqRotina = etqRotina === b.dataset.re ? null : b.dataset.re; render(); return; }
    if (b.dataset.filtro) { filtro = filtro === b.dataset.filtro ? null : b.dataset.filtro; aberto = null; aba = "hoje"; render(); return; }
    if (b.dataset.limpar) { filtro = null; render(); return; }
    if (b.dataset.dn !== undefined) {
      var d = Number(b.dataset.dn), i = diasRotina.indexOf(d);
      if (i === -1) diasRotina.push(d); else diasRotina.splice(i, 1);
      render(); return;
    }
    if (b.id === "btnRot") { criarRotina(); return; }

    // preferências
    if (b.dataset.tog) {
      var k = b.dataset.tog;
      if (k === "auto") { abrirAoLigar = !abrirAoLigar; post({ acao: "abrirAoLigar", valor: abrirAoLigar }); }
      else { C[k] = !C[k]; salvar(); aplicarConfig(); }
      render(); return;
    }
    if (b.dataset.letra) { C.letra = b.dataset.letra; salvar(); aplicarConfig(); render(); return; }
    if (b.dataset.pdia !== undefined) {
      var pd = Number(b.dataset.pdia), pi = C.diasRotina.indexOf(pd);
      if (pi === -1) C.diasRotina.push(pd); else C.diasRotina.splice(pi, 1);
      diasRotina = C.diasRotina.slice();
      salvar(); render(); return;
    }
    if (b.dataset.ecor || b.dataset.edel) {
      var et = acharE(b.closest(".etq").dataset.eid);
      if (!et) return;
      if (b.dataset.ecor) { et.cor = CORES[(CORES.indexOf(et.cor) + 1) % CORES.length]; salvar(); render(); }
      else comDesfazer("Etiqueta apagada", function () {
        C.etiquetas = C.etiquetas.filter(function (x) { return x.id !== et.id; });
        D.tarefas.forEach(function (t) { if (t.etiqueta === et.id) t.etiqueta = null; });
        D.rotinas.forEach(function (r) { if (r.etiqueta === et.id) r.etiqueta = null; });
      });
      return;
    }
    if (b.id === "btnEt") { criarEtiqueta(); return; }
    if (b.dataset.pb) { post({ acao: b.dataset.pb === "escolher" ? "escolherPastaBackup" : "pastaBackupAuto" }); return; }
    if (b.dataset.bk) {
      if (b.dataset.bk === "agora") exportarBackup();
      else { C.backupDepois = Date.now() + 3 * 86400000; persistirLocal(); render(); }
      return;
    }
    if (b.dataset.sync) {
      var a0 = b.dataset.sync;
      if (a0 === "entrar") entrarOuCriar(false);
      else if (a0 === "criar") entrarOuCriar(true);
      else if (a0 === "esqueci") esqueciSenha();
      else if (a0 === "sair") sairConta();
      return;
    }
    if (b.dataset.copiar) { copiar(b.dataset.copiar === "chave" ? PIX.chave : payloadPix()); return; }

    // tarefas
    var li = b.closest(".item");
    if (li && li.dataset.id) {
      var t = acharT(li.dataset.id);
      if (!t) return;
      if (b.dataset.detEt) { t.etiqueta = t.etiqueta === b.dataset.detEt ? null : b.dataset.detEt; salvar(); render(); return; }
      var a = b.dataset.acao;
      if (a === "concluir") concluir(t.id, li);
      else if (a === "prio") { t.prioridade = proxPrio(t.prioridade); salvar(); render(); }
      else if (a === "fechar") { aberto = null; salvar(); render(); }
      else if (a === "semhora") { t.hora = null; salvar(); render(); }
      else if (a === "excluir") comDesfazer("Excluída", function () { D.tarefas = D.tarefas.filter(function (x) { return x.id !== t.id; }); });
      else if (a === "voltar") { t.feita = false; t.feitaEm = null; t.data = hojeStr(); salvar(); render(); toast("Voltou para hoje"); }
      else if (a === "reusar") { var c2 = nova(t.texto, t.prioridade, null, t.etiqueta); c2.obs = t.obs; D.tarefas.push(c2); salvar(); toast("Copiada para hoje"); }
      return;
    }
    if (li && li.dataset.rid) {
      var r = acharR(li.dataset.rid);
      if (!r) return;
      if (b.dataset.racao === "prio") { r.prioridade = proxPrio(r.prioridade); salvar(); render(); }
      else if (b.dataset.racao === "excluir") comDesfazer("Rotina excluída", function () { D.rotinas = D.rotinas.filter(function (x) { return x.id !== r.id; }); });

        if (j === -1) r.dias.push(dd); else r.dias.splice(j, 1);
        salvar(); render();
      }
    }
  });

  function limparAlvo() { conteudo.querySelectorAll(".alvo").forEach(function (x) { x.classList.remove("alvo"); }); }
  conteudo.addEventListener("dragstart", function (e) {
    var li = e.target.closest && e.target.closest(".item[draggable=true]");
    if (!li) return;
    arrastandoId = li.dataset.id;
    li.classList.add("arrastando");
    try { e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", arrastandoId); } catch (err) {}
  });
  conteudo.addEventListener("dragover", function (e) {
    if (!arrastandoId) return;
    var li = e.target.closest(".item[data-id]");
    var lista = e.target.closest("#listaHoje");
    if (!lista) return;
    e.preventDefault();
    limparAlvo();
    if (li && li.dataset.id !== arrastandoId) li.classList.add("alvo");
  });
  conteudo.addEventListener("drop", function (e) {
    if (!arrastandoId) return;
    e.preventDefault();
    var li = e.target.closest(".item[data-id]");
    var movida = acharT(arrastandoId);
    if (!li || !movida || li.dataset.id === arrastandoId) return;
    var alvo = acharT(li.dataset.id);
    var r = li.getBoundingClientRect();
    var depois = e.clientY > r.top + r.height / 2;
    var vis = ordenar(pendentes().filter(function (t) { return !filtro || t.etiqueta === filtro; }))
      .filter(function (t) { return t.id !== movida.id; });
    var i = vis.indexOf(alvo) + (depois ? 1 : 0);
    movida.prioridade = alvo.prioridade;
    vis.splice(i, 0, movida);
    vis.forEach(function (t, k) { t.ordem = k + 1; });
    salvar();
  });
  conteudo.addEventListener("dragend", function () {
    arrastandoId = null;
    limparAlvo();
    render();
  });

  // ---------- lembretes ----------
  function listaLembretes() {
    return D.tarefas.filter(function (t) { return !t.feita && t.hora; }).map(function (t) {
      return { id: t.id, texto: t.texto, quando: t.data + " " + t.hora };
    });
  }
  function enviarLembretes() {
    if (NATIVO) post({ acao: "lembretes", lista: listaLembretes() });
  }
  // fora do Mac (navegador/celular): confere a cada 30 s
  var avisadosWeb = {};
  function pedirPermissaoWeb() {
    if (NATIVO) return;
    try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch (e) {}
  }
  function checarLembretesWeb() {
    if (NATIVO) return;
    var agora = hojeStr() + " " + horaAgora();
    listaLembretes().forEach(function (l) {
      var chave = l.id + l.quando;
      if (l.quando <= agora && l.quando.slice(0, 10) === hojeStr() && !avisadosWeb[chave]) {
        avisadosWeb[chave] = true;
        try {
          if (window.Notification && Notification.permission === "granted") new Notification("Videofotista A Fazer", { body: l.texto });
        } catch (e) {}
        var som = C.som; C.som = true; tocarSom(); C.som = som;
        window.alarme(l.id);
      }
    });
  }
  window.alarme = function (id) {
    var t = acharT(id);
    if (!t) return;
    aba = t.data <= hojeStr() ? "hoje" : "proximos";
    filtro = null;
    destaque = id;
    render();
    var el = conteudo.querySelector('.item[data-id="' + id + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "center" });
    toast("⏰ " + t.texto);
    setTimeout(function () { destaque = null; }, 4500);
  };

  function criarRotina() {
    var inp = document.getElementById("rotTxt");
    var v = inp.value.trim();
    if (!v) return;
    if (!diasRotina.length) { toast("Marque pelo menos um dia"); return; }
    var lido = lerTexto(v, prioRotina);
    var r = { id: novoId(), texto: lido.texto, prioridade: lido.prioridade, dias: diasRotina.slice(), etiqueta: etqRotina, hora: horaRotina };
    D.rotinas.push(r);
    prioRotina = 4; etqRotina = null; horaRotina = null; diasRotina = C.diasRotina.slice();
    var entrouHoje = r.dias.indexOf(new Date().getDay()) !== -1;
    gerarRotinaHoje(r, new Date().getDay());
    inp.value = "";
    salvar(); render();
    toast(entrouHoje ? "Rotina criada (já entrou hoje)" : "Rotina criada");
    focar();
  }

  function criarEtiqueta() {
    var inp = document.getElementById("novaEt");
    var v = inp.value.trim();
    if (!v) return;
    var usadas = C.etiquetas.map(function (e) { return e.cor; });
    var cor = CORES.find(function (c) { return usadas.indexOf(c) === -1; }) || CORES[C.etiquetas.length % CORES.length];
    C.etiquetas.push({ id: "e-" + novoId(), nome: v, cor: cor });
    inp.value = "";
    salvar(); render();
    var n = document.getElementById("novaEt"); if (n) n.focus();
  }

  function copiar(txt) {
    if (NATIVO) { post({ acao: "copiar", texto: txt }); toast("Copiado!"); return; }
    try { navigator.clipboard.writeText(txt).then(function () { toast("Copiado!"); }); } catch (e) {}
  }

  // ---------- backup ----------
  function exportarBackup() {
    var json = JSON.stringify(D, null, 2);
    var nome = "Videofotista A Fazer - backup " + hojeStr() + ".json";
    C.ultimoBackup = Date.now(); C.backupDepois = 0; persistirLocal();
    if (NATIVO) { post({ acao: "exportar", json: json }); render(); return; }
    try {
      var arq = new File([json], nome, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [arq] })) {
        navigator.share({ files: [arq], title: nome }).catch(function () {});
        render(); return;
      }
    } catch (e) {}
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Backup salvo em Downloads");
    render();
  }
  // lembrete: fora do Mac, sem conta conectada, a cada 7 dias
  function precisaLembrarBackup() {
    if (NATIVO || SYNC.uid || C.lembreteBackup === false) return false;
    if (D.tarefas.length + D.rotinas.length < 3) return false;
    var agora = Date.now();
    if (C.backupDepois && agora < C.backupDepois) return false;
    return !C.ultimoBackup || agora - C.ultimoBackup > 7 * 86400000;
  }
  function htmlLembreteBackup() {
    if (!precisaLembrarBackup()) return "";
    var dias = C.ultimoBackup ? Math.floor((Date.now() - C.ultimoBackup) / 86400000) : null;
    return '<div class="caixa aviso-backup"><b>Hora de guardar um backup</b>' +
      '<div class="dica" style="margin:4px 0 8px">' + (dias ? "Faz " + dias + " dias desde o último. " : "Você ainda não guardou nenhum. ") +
      "Suas tarefas ficam só neste aparelho: salve o arquivo no Drive, no iCloud ou mande para você mesmo.</div>" +
      '<div class="linha-acao" style="margin:0"><button class="btn-sec" data-bk="depois">Depois</button><button class="btn-add" data-bk="agora">Fazer backup agora</button></div></div>';
  }

  var menuB = document.getElementById("menuBackup");
  if (!NATIVO) document.getElementById("bPasta").style.display = "none";
  document.getElementById("btnBackup").onclick = function (e) { e.stopPropagation(); menuB.classList.toggle("aberto"); };
  document.addEventListener("click", function () { menuB.classList.remove("aberto"); });
  menuB.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    menuB.classList.remove("aberto");
    var json = JSON.stringify(D, null, 2);
    if (b.dataset.b === "exportar") exportarBackup();
    else if (b.dataset.b === "importar") {
      if (NATIVO) post({ acao: "importar" });
      else document.getElementById("arquivo").click();
    } else if (b.dataset.b === "pasta") post({ acao: "pastaBackups" });
  });
  document.getElementById("arquivo").addEventListener("change", function (e) {
    var f = e.target.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try { window.receberImportacao(JSON.parse(rd.result)); }
      catch (err) { toast("Arquivo inválido"); }
    };
    rd.readAsText(f);
    e.target.value = "";
  });
  window.receberImportacao = function (obj) {
    if (!obj || !Array.isArray(obj.tarefas)) { toast("Esse arquivo não é um backup do app"); return; }
    snapshot = JSON.stringify(D);
    D = normalizar(obj);
    C = D.config;
    verificarDia();
    salvar(); aplicarConfig(); render();
    toast("Backup importado", true);
  };
  window.atualizarPastaBackup = function (obj) {
    pastaBackup = obj || { escolhida: null, drive: null };
    if (aba === "prefs") render();
  };
  window.atualizarAbrirAoLigar = function (v) {
    abrirAoLigar = !!v;
    if (aba === "prefs") render();
  };
  window.avisar = function (msg) { toast(msg); };

  // ---------- sincronização ----------
  var SYNC = { ativo: false, estado: "desligado", uid: null, email: null, erro: "", ocupado: false };
  var fbAuth = null, fbDb = null, desligarEscuta = null, enviados = {}, prontoNuvem = false, tentouLoginSalvo = false;
  var loginPendente = null;

  function iniciarSync() {
    if (!FIREBASE.apiKey || !window.FB || fbAuth) return;
    // só liga em quem ativou (5 toques na versão, na tela Sobre); quem ganha o app de presente nem conecta
    if (NATIVO && window.__LOGIN__ && window.__LOGIN__.email && !C.syncLigado) { C.syncLigado = true; persistirLocal(); }
    if (!C.syncLigado) return;
    try {
      var F = window.FB;
      var app = F.initializeApp(FIREBASE);
      fbAuth = F.initializeAuth(app, { persistence: [F.indexedDBLocalPersistence, F.browserLocalPersistence, F.inMemoryPersistence] });
      try { fbDb = F.initializeFirestore(app, { localCache: NATIVO ? F.memoryLocalCache() : F.persistentLocalCache() }); }
      catch (e) { fbDb = F.initializeFirestore(app, { localCache: F.memoryLocalCache() }); }
      if (window.__EMULADOR__) {
        F.connectAuthEmulator(fbAuth, window.__EMULADOR__.auth, { disableWarnings: true });
        F.connectFirestoreEmulator(fbDb, "127.0.0.1", window.__EMULADOR__.firestore);
      }
      SYNC.ativo = true;
      F.onAuthStateChanged(fbAuth, mudouUsuario);
    } catch (e) { SYNC.ativo = false; }
  }

  function mudouUsuario(u) {
    if (desligarEscuta) { desligarEscuta(); desligarEscuta = null; }
    prontoNuvem = false; enviados = {};
    if (u) {
      SYNC.uid = u.uid; SYNC.email = u.email; SYNC.estado = "sincronizando"; SYNC.erro = "";
      if (NATIVO && loginPendente) post({ acao: "guardarLogin", email: loginPendente.email, senha: loginPendente.senha });
      loginPendente = null;
      escutarNuvem();
    } else {
      SYNC.uid = null; SYNC.email = null; SYNC.estado = "desligado";
      var salvo = window.__LOGIN__;
      if (NATIVO && salvo && salvo.email && !tentouLoginSalvo) {
        tentouLoginSalvo = true;
        SYNC.estado = "sincronizando";
        window.FB.signInWithEmailAndPassword(fbAuth, salvo.email, salvo.senha).catch(function () { SYNC.estado = "desligado"; render(); });
      }
    }
    render();
  }

  function escutarNuvem() {
    var F = window.FB;
    var col = F.collection(fbDb, "users", SYNC.uid, "itens");
    desligarEscuta = F.onSnapshot(col, { includeMetadataChanges: true }, function (snap) {
      var remotos = {};
      snap.forEach(function (d) { remotos[d.id] = d.data(); });
      receberNuvem(remotos);
      SYNC.estado = snap.metadata.hasPendingWrites ? "enviando" : snap.metadata.fromCache ? "offline" : "sincronizado";
      atualizarStatus();
    }, function (err) {
      SYNC.estado = "erro"; SYNC.erro = (err && err.code) || "";
      atualizarStatus();
    });
  }

  // junta o que veio da nuvem com o que está aqui: vale o mais novo de cada item
  function receberNuvem(remotos) {
    var mudou = false;
    Object.keys(remotos).forEach(function (k) {
      var r = remotos[k], ts = r.atualizadoEm || 0;
      enviados[k] = Math.max(enviados[k] || 0, ts);
      if (k === "c:config") {
        if (ts > (D.configEm || 0) && r.dados) {
          ["etiquetas", "diasRotina", "subirPrioridade", "som"].forEach(function (c) { if (r.dados[c] !== undefined) C[c] = r.dados[c]; });
          D.configEm = ts; mudou = true;
        }
        return;
      }
      var tipo = k.charAt(0), id = k.slice(2);
      var lista = tipo === "t" ? D.tarefas : tipo === "r" ? D.rotinas : null;
      if (!lista) return;
      var i = -1;
      for (var j = 0; j < lista.length; j++) if (lista[j].id === id) { i = j; break; }
      var local = i >= 0 ? lista[i] : null;
      var tsLocal = local ? (local.atualizadoEm || 0) : (D.apagadas[k] || 0);
      if (ts <= tsLocal) return;
      if (r.apagado) {
        if (local) { lista.splice(i, 1); mudou = true; }
        D.apagadas[k] = ts;
      } else if (r.dados) {
        var n = normalizar(tipo === "t" ? { tarefas: [r.dados] } : { rotinas: [r.dados] });
        var novo = tipo === "t" ? n.tarefas[0] : n.rotinas[0];
        if (!novo) return;
        novo.atualizadoEm = ts;
        if (local) lista[i] = novo; else lista.push(novo);
        delete D.apagadas[k];
        mudou = true;
      }
    });
    if (mudou) {
      atualizarBase();
      persistirLocal();
      aplicarConfig();
      if (digitando()) renderPendente = true; else render();
    }
    prontoNuvem = true;
    enviarNuvem();
  }

  function salvarSemRedesenhar() { salvar(); }
  function marcarVazio(el) { var w = el.closest(".com-dica"); if (w) w.classList.toggle("sem-valor", !el.value); }

  // se a pessoa está digitando, espera ela sair do campo para redesenhar a tela
  var renderPendente = false;
  function digitando() {
    var el = document.activeElement;
    return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA") && el.type !== "button";
  }
  document.addEventListener("focusout", function () {
    if (renderPendente) setTimeout(function () { if (!digitando() && renderPendente) { renderPendente = false; render(); } }, 50);
  });

  // manda para a nuvem o que mudou aqui e ela ainda não tem
  function enviarNuvem() {
    if (!SYNC.uid || !prontoNuvem || !fbDb) return;
    var F = window.FB, ops = [];
    var m = itensLocais();
    Object.keys(m).forEach(function (k) {
      var it = m[k], ts = it.atualizadoEm || 0;
      if (ts > (enviados[k] || 0)) ops.push([k, { tipo: k.charAt(0), dados: JSON.parse(JSON.stringify(it)), atualizadoEm: ts, apagado: false }]);
    });
    Object.keys(D.apagadas).forEach(function (k) {
      var ts = D.apagadas[k];
      if (ts > (enviados[k] || 0)) ops.push([k, { tipo: k.charAt(0), atualizadoEm: ts, apagado: true }]);
    });
    if ((D.configEm || 0) > (enviados["c:config"] || 0)) ops.push(["c:config", { tipo: "c", dados: configCompart(), atualizadoEm: D.configEm, apagado: false }]);
    if (!ops.length) return;
    for (var i = 0; i < ops.length; i += 400) {
      var lote = F.writeBatch(fbDb);
      ops.slice(i, i + 400).forEach(function (op) {
        enviados[op[0]] = op[1].atualizadoEm;
        lote.set(F.doc(fbDb, "users", SYNC.uid, "itens", op[0]), op[1]);
      });
      lote.commit().catch(function (err) { SYNC.estado = "erro"; SYNC.erro = (err && err.code) || ""; atualizarStatus(); });
    }
    SYNC.estado = "enviando";
    atualizarStatus();
  }

  var MSG_ERRO = {
    "auth/invalid-credential": "E-mail ou senha errados. Se é a primeira vez, use Criar conta.",
    "auth/wrong-password": "E-mail ou senha errados.",
    "auth/user-not-found": "Não achei conta com esse e-mail. Use Criar conta.",
    "auth/invalid-login-credentials": "E-mail ou senha errados. Se é a primeira vez, use Criar conta.",
    "auth/email-already-in-use": "Esse e-mail já tem conta. Use Entrar.",
    "auth/weak-password": "A senha precisa de pelo menos 6 caracteres.",
    "auth/invalid-email": "Esse e-mail não parece certo.",
    "auth/missing-password": "Faltou a senha.",
    "auth/network-request-failed": "Sem internet agora. Tente de novo.",
    "auth/too-many-requests": "Muitas tentativas. Espere uns minutos.",
    "auth/admin-restricted-operation": "O cadastro de contas novas está fechado.",
    "auth/operation-not-allowed": "O cadastro de contas novas está fechado."
  };
  function entrarOuCriar(criar) {
    var email = (document.getElementById("syncEmail") || {}).value || "";
    var senha = (document.getElementById("syncSenha") || {}).value || "";
    email = email.trim();
    if (!email || !senha) { SYNC.erro = "Preencha o e-mail e a senha."; render(); return; }
    SYNC.ocupado = true; SYNC.erro = ""; render();
    loginPendente = { email: email, senha: senha };
    var F = window.FB;
    (criar ? F.createUserWithEmailAndPassword : F.signInWithEmailAndPassword)(fbAuth, email, senha)
      .then(function () { SYNC.ocupado = false; toast(criar ? "Conta criada e conectada" : "Conectado"); render(); })
      .catch(function (e) { SYNC.ocupado = false; loginPendente = null; SYNC.erro = MSG_ERRO[e && e.code] || "Não deu certo (" + ((e && e.code) || "erro") + ")."; render(); });
  }
  function esqueciSenha() {
    var email = ((document.getElementById("syncEmail") || {}).value || "").trim();
    if (!email) { SYNC.erro = "Escreva o seu e-mail acima e toque de novo em Esqueci a senha."; render(); return; }
    window.FB.sendPasswordResetEmail(fbAuth, email)
      .then(function () { SYNC.erro = ""; toast("Mandei um e-mail para trocar a senha"); render(); })
      .catch(function (e) { SYNC.erro = MSG_ERRO[e && e.code] || "Não consegui mandar o e-mail."; render(); });
  }
  function sairConta() {
    if (NATIVO) post({ acao: "apagarLogin" });
    tentouLoginSalvo = true;
    window.FB.signOut(fbAuth).then(function () { toast("Desconectado. As tarefas continuam aqui."); });
  }

  var ROTULO_SYNC = { sincronizado: "sincronizado", enviando: "enviando…", sincronizando: "conectando…", offline: "sem internet, guardando aqui", erro: "erro na sincronização" };
  function atualizarStatus() {
    var el = document.getElementById("statusSync");
    if (!el) return;
    if (!SYNC.ativo || !SYNC.uid) { el.textContent = ""; el.className = ""; return; }
    el.textContent = "☁ " + (ROTULO_SYNC[SYNC.estado] || "");
    el.className = "sync-" + SYNC.estado;
    if (aba === "prefs") { var p = document.getElementById("prefsSyncEstado"); if (p) p.textContent = ROTULO_SYNC[SYNC.estado] || ""; }
  }

  function htmlSync() {
    if (!SYNC.ativo) return "";
    var h = '<div class="caixa"><h3>Sincronização</h3>';
    if (SYNC.uid) {
      h += '<div class="pref"><div class="rot">Conectado como <b>' + esc(SYNC.email || "") + '</b><small>Situação: <span id="prefsSyncEstado">' + (ROTULO_SYNC[SYNC.estado] || "") + "</span></small></div>" +
        '<button class="btn-sec" data-sync="sair">Sair</button></div>' +
        '<div class="dica" style="margin:6px 0 0">Entre com o mesmo e-mail no Mac e no celular para ver as mesmas tarefas.</div>';
    } else {
      h += '<div class="dica" style="margin:0 0 8px">Entre para ver as mesmas tarefas no Mac e no celular. Na primeira vez, use <b>Criar conta</b>. Depois, em cada aparelho, use <b>Entrar</b> com o mesmo e-mail e senha.</div>' +
        '<input class="campo" id="syncEmail" type="email" autocomplete="username" placeholder="Seu e-mail" style="margin-bottom:6px">' +
        '<input class="campo" id="syncSenha" type="password" autocomplete="current-password" placeholder="Senha (mínimo 6 caracteres)">' +
        (SYNC.erro ? '<div class="dica" style="margin:6px 0 0;color:var(--coral)">' + esc(SYNC.erro) + "</div>" : "") +
        '<div class="linha-acao" style="justify-content:space-between;align-items:center">' +
        '<button class="link" data-sync="esqueci">Esqueci a senha</button>' +
        '<span><button class="btn-sec" data-sync="criar"' + (SYNC.ocupado ? " disabled" : "") + '>Criar conta</button> ' +
        '<button class="btn-add" data-sync="entrar"' + (SYNC.ocupado ? " disabled" : "") + ">" + (SYNC.ocupado ? "Aguarde…" : "Entrar") + "</button></span></div>";
    }
    return h + "</div>";
  }
  window.abrirSincronizacao = function () { irPara("prefs"); };

  // 5 toques seguidos na versão (tela Sobre) ligam ou desligam a sincronização neste aparelho
  var toquesVersao = 0, timerToques = null;
  document.getElementById("conteudo").addEventListener("click", function (e) {
    if (!e.target.closest("#versaoApp")) return;
    toquesVersao++;
    clearTimeout(timerToques);
    timerToques = setTimeout(function () { toquesVersao = 0; }, 1500);
    if (toquesVersao < 5) return;
    toquesVersao = 0;
    if (!FIREBASE.apiKey) return;
    if (!C.syncLigado) {
      C.syncLigado = true; persistirLocal(); iniciarSync();
      toast("Sincronização ligada"); irPara("prefs");
    } else if (!SYNC.uid) {
      C.syncLigado = false; persistirLocal();
      toast("Sincronização escondida"); render();
    } else {
      toast("Saia da conta antes, em Preferências");
    }
  });

  // ---------- início ----------
  atualizarBase();
  aplicarConfig();
  render();
  verificarDia();
  setInterval(verificarDia, 60 * 1000);
  enviarLembretes();
  iniciarSync();
  if (!NATIVO) { setInterval(checarLembretesWeb, 30 * 1000); checarLembretesWeb(); }
  if (!NATIVO && "serviceWorker" in navigator && location.protocol === "https:") {
    try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) verificarDia(); });
  setTimeout(focar, 50);
})();
</script>
</body>
</html>
